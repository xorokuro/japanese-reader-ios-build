name: JapaneseReader
options:
  bundleIdPrefix: com.xorokuro
  deploymentTarget:
    iOS: '17.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  JapaneseReader:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xorokuro.JapaneseReader
        SWIFT_OBJC_BRIDGING_HEADER: Sources/WebViewBridge.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Japanese Reader
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: '1.5'
        CURRENT_PROJECT_VERSION: '6'
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
  ReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JapaneseReader
  ReaderUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UnitTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JapaneseReader
schemes:
  JapaneseReader:
    build:
      targets:
        JapaneseReader: all
    test:
      targets: [ReaderUnitTests, ReaderUITests]
