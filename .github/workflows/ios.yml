name: Build iPhone app
on:
  workflow_dispatch:
# User-authorized public build only. Disable Actions before making this repository private.
permissions:
  contents: read
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test native dictionary engine
        run: python3 ios/test_core.py
      - name: Build unsigned device app
        run: bash ios/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JapaneseReader-iPhone
          path: ios/build/JapaneseReader.ipa
          retention-days: 14
      - name: Test iPhone interface
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPhone" in x["name"]))')
          xcodebuild -project ios/JapaneseReader.xcodeproj -scheme JapaneseReader -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath ios/build/UIResults.xcresult CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 test
      - name: Export simulator screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path ios/build/UIResults.xcresult --output-path ios/build/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-test-results
          path: |
            ios/build/screenshots/*.png
            ios/build/screenshots/*.txt
            ios/build/screenshots/manifest.json
          retention-days: 7


